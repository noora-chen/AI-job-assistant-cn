name: Daily Job Search

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 1:00（北京时间 9:00）自动运行
  workflow_dispatch: {}    # 允许在Actions页面手动点击运行
  push:
    branches: [main]       # 每次推送到main分支也会跑一次

permissions:
  contents: write           # 允许工作流把结果提交回仓库

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复历史职位数据库（data-branch）
        run: |
          git fetch origin data-branch 2>/dev/null || true
          git show origin/data-branch:jobs.db > jobs.db 2>/dev/null || echo "首次运行，没有历史数据库"

      - name: 运行抓取脚本，生成网页
        run: python job_searcher.py --site --save

      - name: 把最新数据库存回 data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f jobs.db
          git stash
          git checkout -B data-branch origin/data-branch 2>/dev/null || git checkout -B data-branch
          git stash pop
          git add -f jobs.db
          git commit -m "更新职位数据库 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "没有变化，跳过提交"
          git push origin data-branch --force

      - name: 切回主分支
        run: git checkout main

      - name: 部署网页到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,jobs.db,job_searcher.py,requirements.txt,README.md,*.py'
